services:
  diag-viewer:
    build: .
    image: diag-viewer:latest
    container_name: diag-viewer
    ports:
      - "8080:8080"
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:?defina UPLOAD_TOKEN no arquivo .env}
      READ_TOKEN: ${READ_TOKEN:-}
      MAX_MB: ${MAX_MB:-500}
      TZ: America/Sao_Paulo
    volumes:
      - coletas:/data
    restart: unless-stopped

volumes:
  coletas:
